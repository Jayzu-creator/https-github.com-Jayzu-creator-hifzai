services:
  - type: web
    name: hifzai-payments
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: YOCO_SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RECITATION_ENABLED
        value: "true"
      - key: PAID_PLANS_ENABLED
        value: "true"
